[package]
name = "locallab-desktop"
version = "0.1.0"
description = "LocalLab desktop shell (Tauri v2) hosting the static web export and local sidecar processes"
author = "LocalLab"
license = "UNLICENSED"
edition = "2021"

# The shipped executable is renamed to `productName` (LocalLab) by tauri-build.
[lib]
name = "locallab_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "locallab-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.0.0", features = [] }

[dependencies]
tauri = { version = "=2.0.0", features = [] }
