services:
  api:
    image: node:24-alpine
    working_dir: /workspace
    init: true
    command:
      - sh
      - -c
      - corepack enable && pnpm install --no-frozen-lockfile && pnpm --filter @locallab/api dev
    environment:
      HOST: 0.0.0.0
      PORT: 3001
    ports:
      - "3001:3001"
    volumes:
      - ../..:/workspace
      - locallab_pnpm_store:/root/.local/share/pnpm/store
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  locallab_pnpm_store:
