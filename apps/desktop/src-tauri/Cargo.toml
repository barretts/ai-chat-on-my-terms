[package]
name = "locallab-desktop"
version = "0.1.0"
description = "AI Chat on My Terms desktop shell (Tauri v2) hosting the static web export and local sidecar processes"
author = "AI Chat on My Terms"
license = "UNLICENSED"
edition = "2021"

# The shipped executable is renamed to `productName` (AI Chat on My Terms) by tauri-build.
[lib]
name = "locallab_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "locallab-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.0.0", features = [] }

[dependencies]
tauri = { version = "=2.0.0", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "=0.32.1", features = ["bundled"] }
rfd = "=0.14.1"
base64 = "=0.22.1"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust", "vendored"] }
