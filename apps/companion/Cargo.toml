[package]
name = "locallab-companion"
version = "0.1.0"
edition = "2021"
description = "Local companion process for the AI Chat on My Terms desktop application"
license = "UNLICENSED"

[[bin]]
name = "locallab-companion"
path = "src/main.rs"

[dependencies]
aes-gcm = "=0.10.3"
hkdf = "=0.12.4"
hmac = "=0.12.1"
locallab-gguf-worker = { path = "../../workers/gguf" }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
subtle = "=2.6.1"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust", "vendored"] }

[dev-dependencies]
serde_json = "=1.0.145"
